# Builds Slopify for Windows, like T3 Code's nightly releases:
# - a nightly build of master at most every 6 hours, whenever master has changed since the
#   last one. The schedule checks twice an hour, because GitHub often drops or delays
#   scheduled runs: after a missed check there's another chance 30 minutes later, instead of
#   6 hours later. The check runs on a small Linux machine; the Windows build only starts
#   when a nightly is due.
#   Scheduled builds only run once nightlies are switched on: set the repository
#   variable SLOPIFY_PUBLISH_NIGHTLIES to "true" (see docs/windows-releases.md);
# - on demand (Actions → Release → Run workflow), a nightly or stable build.
#
# Releases live in this public source repository. Publishing uses GITHUB_TOKEN, and
# only the publish job can write to the repository. Manual builds default to
# downloadable artifacts only.
#
# A release that's published (nightly or stable) first deploys the online service from
# the same source: the database's new migrations, the Worker, and the shared-playlist
# link site (cloud/share-site/). The release isn't published if that fails. The cloud
# job needs the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/cloud.md).
name: Release

on:
  schedule:
    # Twice an hour, off the hour, when GitHub delays and drops scheduled runs the most.
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [nightly, stable]
        default: nightly
      publish:
        description: Publish a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

# Nightlies (scheduled and manual) run one at a time, so two can't build or publish at once;
# each queued run checks again whether a nightly is due once it starts. Stable releases have
# their own queue, so a nightly never holds one up. queue: max keeps every waiting run, where
# GitHub otherwise keeps only the newest and cancels the rest, so a manual run can't be
# dropped behind a scheduled one. Production deploys, from either queue, take turns in the
# cloud job's own group.
concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'stable' }}
  cancel-in-progress: false
  queue: max

jobs:
  # Decides whether this run builds and publishes. Every later job builds, deploys and
  # publishes github.sha, the commit checked here: for a scheduled run, master as it was when
  # the run started, so a merge during the build can't slip into a release it wasn't checked for.
  gate:
    name: Decide what to build
    if: github.event_name != 'schedule' || vars.SLOPIFY_PUBLISH_NIGHTLIES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # (actions: to read the earlier release runs.)
      actions: read
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Decide
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.publish == 'true' }}
          # The shortest time between two scheduled nightlies.
          MINIMUM_GAP_SECONDS: 21600
        run: |
          set -euo pipefail
          decide() {
            echo "build=$1" >> "$GITHUB_OUTPUT"
            echo "publish=$2" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [[ "$EVENT" != "schedule" ]]; then
            decide true "$REQUESTED"
          fi

          # Only reads; a brief GitHub hiccup gets two more tries before this check gives up
          # (and the next check, 30 minutes later, tries again).
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          now=$(date -u +%s)

          # Back off after a failed release. A release that fails after its build (a cloud check, then a
          # rollback; or publishing) would otherwise build and deploy again at every check, restarting Listen
          # Along rooms each time. Only runs of master that got as far as building count, so a check that
          # failed or skipped before building can't hold nightlies up. Manual runs always go ahead, so a fix
          # can be shipped by hand straight away.
          runs=$(retry gh run list --repo "$REPO" --workflow release.yml --branch master --status completed \
            --limit 50 --json databaseId,conclusion,updatedAt --jq '.[] | "\(.databaseId) \(.conclusion) \(.updatedAt)"' < /dev/null)
          while read -r id conclusion finished; do
            [[ -n "$id" ]] || continue
            ago=$(( now - $(date -u -d "$finished" +%s) ))
            (( ago < MINIMUM_GAP_SECONDS )) || continue
            built=$(retry gh api "repos/$REPO/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "windows" and .conclusion != null and .conclusion != "skipped")] | length' < /dev/null)
            (( built > 0 )) || continue
            if [[ "$conclusion" == "failure" || "$conclusion" == "timed_out" ]]; then
              echo "::warning::The last release, https://github.com/$REPO/actions/runs/$id, failed $((ago / 60)) minutes ago. Scheduled nightlies wait $(( (MINIMUM_GAP_SECONDS - ago) / 60 )) more minutes before trying again; run the workflow by hand to release a fix sooner."
              decide false false
            fi
            break
          done <<< "$runs"

          # The newest published nightly, by when it was published.
          last=$(retry gh release list --repo "$REPO" --limit 100 --exclude-drafts \
            --json tagName,isPrerelease,publishedAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | contains("-nightly.")))] | sort_by(.publishedAt) | last // empty | "\(.tagName) \(.publishedAt)"')
          if [[ -z "$last" ]]; then
            echo "No nightly published yet. Building one of $SHA."
            decide true true
          fi
          read -r tag published <<< "$last"

          age=$(( now - $(date -u -d "$published" +%s) ))
          if (( age < MINIMUM_GAP_SECONDS )); then
            echo "$tag was published $((age / 60)) minutes ago; the next nightly is due $(( (MINIMUM_GAP_SECONDS - age) / 60 )) minutes from now."
            decide false false
          fi

          # Commits master has that the last nightly doesn't. Also counts when that nightly was
          # a manual build of another branch (master has then diverged from it), so a branch
          # nightly can't hold up the next nightly of master.
          newer=$(retry gh api "repos/$REPO/compare/$tag...$SHA" --jq .ahead_by)
          if (( newer == 0 )); then
            echo "master ($SHA) has no commits that $tag doesn't. Nothing new to build."
            decide false false
          fi

          echo "master ($SHA) has $newer commits that $tag doesn't, published $((age / 3600)) hours ago. Building a nightly."
          decide true true

  windows:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      # The commit built, so the online service is deployed, and the release published, from the same one.
      source: ${{ steps.source.outputs.sha }}
    env:
      SLOPIFY_UPDATE_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL: ${{ github.event.inputs.channel || 'nightly' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Note the commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          npm run build
          node scripts/package-windows.mjs --channel $env:CHANNEL

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: slopify-windows-${{ env.CHANNEL }}
          path: |
            release/*/
            !release/*/*.blockmap
          retention-days: 14

      # Everything the publish job needs: the build record and every file it lists.
      - name: Hand the build to the publish job
        if: needs.gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: slopify-publish
          path: |
            release/last-build.json
            release/*/
          retention-days: 1

  # The online service, deployed before the app that uses it is published. Every version of the app, Stable and
  # Nightly, uses this one service, so it keeps answering older versions (see "Old versions of the app" in
  # docs/cloud.md), and only master is deployed. The Worker is only deployed when cloud/ changed since the
  # source that's live, so a release of the app alone doesn't restart Listen Along rooms. A deployed Worker that
  # isn't on production's database, or doesn't answer, is rolled back, and the release isn't published.
  cloud:
    needs: [gate, windows]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One production deploy at a time, from nightly and stable runs alike: two at once could each roll back the
    # other's Worker. queue: max keeps every waiting deploy (by default GitHub cancels all but the newest, which
    # would fail its release).
    concurrency:
      group: cloud-production
      cancel-in-progress: false
      queue: max
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHANNEL: ${{ github.event.inputs.channel || 'nightly' }}
      SOURCE: ${{ needs.windows.outputs.source }}
      # Production's database (wrangler.jsonc): a deployed Worker bound to any other is rolled back.
      PRODUCTION_DB: d0512d09-5cff-4dd4-8ec0-1b157cf27f20
      HEALTH_URL: https://slopify-cloud.gavdie01.workers.dev/v1/health
    defaults:
      run:
        working-directory: cloud
    steps:
      # Without the Cloudflare secrets (docs/cloud.md) nothing is deployed, rather than holding up the release.
      - name: Check for the Cloudflare secrets
        id: creds
        shell: bash
        # (Before the checkout, cloud/ isn't there yet.)
        working-directory: .
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set, so the online service wasn't deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Another branch's online service would go live for everyone, so a release from it isn't published.
      - name: Only master goes to production
        if: steps.creds.outputs.ok == 'true'
        shell: bash
        working-directory: .
        env:
          REF: ${{ github.ref }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          if [[ "$SCHEDULED" != "true" && "$REF" != "refs/heads/master" ]]; then
            echo "::error::Only a release from master deploys the online service, which every version of the app uses. Publish from master, or build with publish off."
            exit 1
          fi

      # The commit the app was built from, with the history to compare it with what's live.
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      # The live version (to roll back to), and the source it was deployed from (in its message, set below).
      # Nightly and stable runs build side by side and then take turns here, so an older commit's run can reach
      # this step after a newer one has deployed: then what's live already includes this source and is left alone.
      - name: Compare with what's live
        id: live
        if: steps.creds.outputs.ok == 'true'
        shell: bash
        run: |
          npx wrangler deployments list --json > "$RUNNER_TEMP/deployments.json"
          read -r version from < <(node -e '
            const last = require(process.argv[1]).at(-1);
            const version = last?.versions?.length === 1 ? last.versions[0].version_id : "-";
            const from = /release from ([0-9a-f]{40})\b/.exec(last?.annotations?.["workers/message"] ?? "")?.[1] ?? "-";
            console.log(version, from);
          ' "$RUNNER_TEMP/deployments.json")
          [[ "$version" == "-" ]] && version=""
          [[ "$from" == "-" ]] && from=""
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -n "$from" && "$from" != "$(git rev-parse HEAD)" ]] && git cat-file -e "$from^{commit}" 2>/dev/null && git merge-base --is-ancestor HEAD "$from"; then
            echo "The live Worker is from $from, which is newer than $SOURCE and includes it, so it doesn't go back to this one."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$from" ]] && git cat-file -e "$from^{commit}" 2>/dev/null && git diff --quiet "$from" HEAD -- . ':(exclude)share-site'; then
            echo "The live Worker is from $from, and cloud/ hasn't changed since, so it isn't deployed again."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Live: ${version:-unknown version}, from ${from:-an unknown source}. Deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.live.outputs.deploy == 'true'
        run: npm run typecheck

      - name: Migrate the database
        if: steps.live.outputs.deploy == 'true'
        run: npm run db:migrate

      - name: Deploy the Worker
        id: deploy
        if: steps.live.outputs.deploy == 'true'
        run: npx wrangler deploy --message "$CHANNEL release from $SOURCE"

      - name: Check the deployed Worker
        if: steps.live.outputs.deploy == 'true'
        shell: bash
        run: |
          npx wrangler deployments list --json > "$RUNNER_TEMP/deployed.json"
          version=$(node -p 'require(process.argv[1]).at(-1).versions[0].version_id' "$RUNNER_TEMP/deployed.json")
          npx wrangler versions view "$version" --json > "$RUNNER_TEMP/version.json"
          node -e '
            const db = require(process.argv[1]).resources.bindings.find((b) => b.name === "DB");
            if (db?.database_id !== process.env.PRODUCTION_DB) {
              console.log(`::error::The deployed Worker is on database ${db?.database_id}, not the production database.`);
              process.exit(1);
            }
          ' "$RUNNER_TEMP/version.json"
          for attempt in 1 2 3 4 5 6; do
            # (The reply is read first: with pipefail, grep -q stopping early could fail curl, and the check.)
            if reply=$(curl -fsS --max-time 10 "$HEALTH_URL") && grep -q '"ok":true' <<< "$reply"; then echo "It answers."; exit 0; fi
            sleep 5
          done
          echo "::error::The deployed Worker doesn't answer $HEALTH_URL."
          exit 1

      # After a failed check, or a deploy that failed partway (wrangler may have switched versions before failing):
      # whatever is live now, if it isn't the version from before, goes back to it.
      - name: Roll the Worker back
        if: failure() && steps.deploy.outcome != 'skipped' && steps.live.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.live.outputs.version }}
        run: |
          npx wrangler deployments list --json > "$RUNNER_TEMP/now.json"
          now=$(node -p 'const v = require(process.argv[1]).at(-1).versions; v.length === 1 ? v[0].version_id : "mixed"' "$RUNNER_TEMP/now.json")
          if [[ "$now" == "$VERSION" ]]; then
            echo "Production is still on $VERSION: nothing to roll back."
          else
            npx wrangler rollback "$VERSION" --message "The $CHANNEL release's checks failed" --yes
          fi

      # From outside the repository, as it was first deployed: next to a wrangler.jsonc, wrangler would take the
      # Worker's config for the site's. Like the Worker, a site that's live from a newer source (which includes
      # this one) is left alone. The site has its own live source, since a release can change it without the Worker.
      - name: Deploy the shared-playlist link site
        if: steps.creds.outputs.ok == 'true'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          live=$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/slopify-app" |
            node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () =>
              console.log(JSON.parse(s).result?.canonical_deployment?.deployment_trigger?.metadata?.commit_hash ?? ""))' 2> /dev/null) ||
            { echo "::warning::Couldn't read which source the live link site is from, so it's deployed."; live=""; }
          if [[ -n "$live" && "$live" != "$SOURCE" ]] && git -C "$GITHUB_WORKSPACE" cat-file -e "$live^{commit}" 2>/dev/null &&
            git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$SOURCE" "$live"; then
            echo "The live link site is from $live, which is newer than $SOURCE and includes it, so it doesn't go back to this one."
            exit 0
          fi
          npx --prefix "$GITHUB_WORKSPACE/cloud" wrangler pages deploy "$GITHUB_WORKSPACE/cloud/share-site" --project-name slopify-app --branch master --commit-hash "$SOURCE"
          for attempt in 1 2 3 4 5 6; do
            if page=$(curl -fsS --max-time 10 https://slopify-app.pages.dev/p/aaaaaaaaaaaaaaaa) && grep -q "slopify://p/" <<< "$page"; then echo "It answers."; exit 0; fi
            sleep 5
          done
          echo "::error::https://slopify-app.pages.dev doesn't show the playlist page."
          exit 1

  publish:
    needs: [gate, windows, cloud]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Only the publishing script is used from the checkout (the commit the app was built from); nothing is
      # built here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.windows.outputs.source }}

      # The script's own packages (the release notes use semver). --ignore-scripts: nothing is built, so
      # Electron isn't downloaded.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v7
        with:
          name: slopify-publish
          path: release

      - name: Publish
        run: node scripts/publish-release.mjs
