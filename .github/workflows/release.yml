# Builds Slopify for Windows, like T3 Code's nightly releases:
# - every night, a nightly build of master, skipped when nothing changed since the last one.
#   Scheduled builds only run once nightlies are switched on: set the repository
#   variable SLOPIFY_PUBLISH_NIGHTLIES to "true" (see docs/windows-releases.md);
# - on demand (Actions → Release → Run workflow), a nightly or stable build.
#
# Releases live in this public source repository. Publishing uses GITHUB_TOKEN, and
# only the publish job can write to the repository. Manual builds default to
# downloadable artifacts only.
name: Release

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [nightly, stable]
        default: nightly
      publish:
        description: Publish a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    if: github.event_name != 'schedule' || vars.SLOPIFY_PUBLISH_NIGHTLIES == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    env:
      SLOPIFY_UPDATE_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL: ${{ github.event.inputs.channel || 'nightly' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || github.ref }}

      - name: Skip if master hasn't changed since the last Nightly
        id: changes
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          source=$(git rev-parse HEAD)
          last=$(gh release list --repo "$SLOPIFY_UPDATE_REPO" --limit 30 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | contains("-nightly.")))][0].tagName // ""')
          if [[ -n "$last" ]] && gh release view "$last" --repo "$SLOPIFY_UPDATE_REPO" --json body --jq .body | grep -Fxq "Source: $source"; then
            echo "Nothing new since $last."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to publish
        id: plan
        shell: bash
        env:
          SKIP: ${{ steps.changes.outputs.skip }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          REQUESTED: ${{ github.event.inputs.publish == 'true' }}
        run: |
          if [[ "$SKIP" != "true" && ( "$SCHEDULED" == "true" || "$REQUESTED" == "true" ) ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.changes.outputs.skip != 'true'
        run: npm ci

      - name: Build
        if: steps.changes.outputs.skip != 'true'
        run: |
          npm run build
          node scripts/package-windows.mjs --channel $env:CHANNEL

      - name: Keep the build
        if: steps.changes.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: slopify-windows-${{ env.CHANNEL }}
          path: |
            release/*/
            !release/*/*.blockmap
          retention-days: 14

      # Everything the publish job needs: the build record and every file it lists.
      - name: Hand the build to the publish job
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: slopify-publish
          path: |
            release/last-build.json
            release/*/
          retention-days: 1

  publish:
    needs: windows
    if: needs.windows.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Only the publishing script is used from the checkout; nothing is built here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          name: slopify-publish
          path: release

      - name: Publish
        run: node scripts/publish-release.mjs
