<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Slopify's icon (public/favicon.svg) on Apple's macOS icon grid: an 824 px rounded square, centred, with its shadow. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff6fb1"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" filter="url(#shadow)"/>
  <g transform="translate(100 100) scale(12.875)" fill="#fff">
    <rect x="15" y="26" width="5" height="12" rx="2.5"/><rect x="24" y="18" width="5" height="28" rx="2.5"/><rect x="33" y="22" width="5" height="20" rx="2.5"/><rect x="42" y="28" width="5" height="8" rx="2.5"/>
  </g>
</svg>
