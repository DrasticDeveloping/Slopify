<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A playlist on Slopify</title><meta name="robots" content="noindex">
<!-- The same page as the service's own /p/<id> (cloud/src/index.ts, sharePage): it hands the link to the desktop app. -->
<style>body{font:16px/1.5 system-ui,sans-serif;background:#0b0b10;color:#eee;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}main{max-width:30rem;padding:2rem}h1{font-size:1.5rem;margin:0 0 .5rem}p{color:#b8b8c4}a.btn{display:inline-block;margin:1rem 0;padding:.7rem 1.4rem;border-radius:999px;background:#a78bfa;color:#0b0b10;font-weight:700;text-decoration:none}small{color:#8a8a98}code{user-select:all;word-break:break-all;color:#ddd}</style></head>
<body><main id="page"><h1>This playlist link doesn't look right</h1><p>Ask for the link again.</p></main>
<script>
  var id = /^\/p\/([a-z0-9]{16})\/?$/.exec(location.pathname);
  if (id) {
    var app = "slopify://p/" + id[1];
    document.getElementById("page").innerHTML = '<h1>Opening the playlist in Slopify…</h1><p>Someone shared a Slopify playlist with you.</p>'
      + '<a class="btn" href="' + app + '">Open in Slopify</a>'
      + "<p><small>Nothing happened? Open Slopify, sign in, and paste this page's address into the search bar.</small></p>";
    location.href = app;
  }
</script></body></html>
